name: Contract + Policy Feed Tests

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "docs/**"
      - "lib/**"
      - "public/**"
      - "rules/**"
      - "rules/policy-vendor-candidates.json"
      - "scripts/**"
      - "sdk/**"
      - "README.md"
      - "middleware.js"
      - "package.json"
      - "package-lock.json"
      - "server.json"
      - ".github/workflows/contract-policy-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - "docs/**"
      - "lib/**"
      - "public/**"
      - "rules/**"
      - "rules/policy-vendor-candidates.json"
      - "scripts/**"
      - "sdk/**"
      - "README.md"
      - "middleware.js"
      - "package.json"
      - "package-lock.json"
      - "server.json"
      - ".github/workflows/contract-policy-tests.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts

      - name: Run policy evidence and strict schema regressions
        run: |
          npm run test:policy-evidence
          npm run test:policy-mcp-contracts
          npm run test:policy-mcp-http
          npm run test:policy-candidate-reviews

      - name: Verify policy artifact database boundary in isolated PostgreSQL
        run: env PATH="$(pg_config --bindir):$PATH" npm run test:policy-evidence-postgres

      - name: Run decision contract tests
        run: |
          npm run test:gemini-budget
          npm run test:gemini-routing
          npm run test:contract

      - name: Verify public SDK package
        run: npm run test:sdk-package

      - name: Run policy feed reliability tests
        run: npm run test:policy-feed

      - name: Run policy checker reliability tests
        run: npm run test:policy-check

      - name: Run policy vendor lifecycle tests
        run: |
          npm run test:policy-vendor-lifecycle
          npm run test:policy-vendor-candidates
          npm run test:policy-coverage-scorecard

      - name: Verify published policy source mirrors
        run: npm run test:public-policy-sources

      - name: Run policy alerts API contract tests
        run: npm run test:policy-alerts-api

      - name: Run Policy MCP contract tests
        run: npm run test:policy-mcp

      - name: Run MCP telemetry and adoption tests
        run: |
          npm run test:mcp-telemetry
          npm run test:mcp-adoption

      - name: Run Zendesk reference workflow tests
        run: npm run workflow:test

      - name: Run public bridge regression tests
        run: npm run test:site-bridge
